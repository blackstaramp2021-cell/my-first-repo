<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>My First Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <header id="home">
        <h1>私の初めてのWebサイト</h1>
    </header>

    <main>
        <!-- About セクション -->
        <section id="about" class="about-section fade-section">
            <h2>About</h2>

            <div class="profile-container">
                <img src="figure_gray_zone.png" alt="プロフィール画像" class="profile-image">

                <div class="profile-text">
                    <h3>プロフィール</h3>
                    <p>
                        はじめまして、Satoruです。  
                        Web制作の学習をスタートしたばかりですが、少しずつ自分のサイトを作っています。  
                        このページは HTML と CSS の練習を兼ねて作成しています。
                    </p>
                </div>
            </div>
        </section>

        <!-- Skills セクション -->
        <section id="skills" class="fade-section">
            <h2>Skills</h2>
            <ul>
                <li>HTML の基礎</li>
                <li>CSS の基本的なスタイリング</li>
                <li>Git・GitHub を使ったバージョン管理</li>
            </ul>
        </section>

        <!-- Contact セクション -->
        <section id="contact" class="fade-section">
            <h2>Contact</h2>
            <p>お問い合わせはこちらに書きます。</p>
            <p>
                <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="btn">
                    GitHubへ
                </a>
            </p>
        </section>
    </main>

        <footer>
        <p>© 2025 Satoru</p>
    </footer>

    <!-- スクロールフェード用スクリプト -->
    <script>
        window.addEventListener('scroll', function() {
            const sections = document.querySelectorAll('.fade-section');
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                if(rect.top < window.innerHeight - 50) {
                    section.classList.add('visible');
                }
            });
        });
    </script>
</body>
</html>
