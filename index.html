<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>My First Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <header id="home">
        <h1>私の初めてのWebサイト</h1>
    </header>

    <main>
        <!-- About セクション -->
        <section id="about">
            <h2>About</h2>
            <img src="figure_gray_zone.png" alt="プロフィール画像" width="200">
            <p>このサイトについての説明を書きます。</p>
        </section>

        <!-- Skills セクション（新規追加） -->
        <section id="skills">
            <h2>Skills</h2>
            <ul>
                <li>HTML の基礎</li>
                <li>CSS の基本的なスタイリング</li>
                <li>Git・GitHub を使ったバージョン管理</li>
            </ul>
        </section>

        <!-- Contact セクション -->
        <section id="contact">
            <h2>Contact</h2>
            <p>お問い合わせはこちらに書きます。</p>
            <p>
                GitHub 公式サイトはこちら：
                <a href="https://github.com" target="_blank" rel="noopener noreferrer">
                    GitHubへ
                </a>
            </p>
        </section>
    </main>

    <footer>
        <p>© 2025 Satoru</p>
    </footer>
</body>
</html>
